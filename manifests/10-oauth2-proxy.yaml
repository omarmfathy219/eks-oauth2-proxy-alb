# Solution 1 only. The ALB sends traffic here, not to the app: oauth2-proxy
# authenticates, then proxies upstream to my-app:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels: { app: oauth2-proxy }
spec:
  replicas: 2
  selector:
    matchLabels: { app: oauth2-proxy }
  template:
    metadata:
      labels: { app: oauth2-proxy }
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=$(OIDC_ISSUER)
            - --http-address=0.0.0.0:4180
            - --upstream=http://my-app:8080
            - --email-domain=*
            - --cookie-secure=true
            - --reverse-proxy=true          # trust the ALB's X-Forwarded-* headers
            - --skip-provider-button=true
            - --set-xauthrequest=true       # pass identity upstream as X-Auth-Request-*
          env:
            - name: OIDC_ISSUER
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: issuer } }
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: cookie-secret } }
          ports:
            - containerPort: 4180
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector: { app: oauth2-proxy }
  ports:
    - port: 4180
      targetPort: 4180
